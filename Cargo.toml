[package]
name = "cast2video"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity"]
description = "Professional Asciinema (.cast) to MP4 / WebM video converter library and CLI"
license = "MIT"
keywords = ["asciinema", "cast", "video", "mp4", "webm"]
categories = ["command-line-utilities", "multimedia::video"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "color", "help", "usage"] }
colored = "3.1"
inquire = "0.9.4"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
thiserror = "2.0"
which = "8.0"

[[bin]]
name = "cast2video-rs"
path = "src/main.rs"

[lib]
name = "cast2video"
path = "src/lib.rs"

name: Rust CI

on:
  push:
    # No branch filter = runs on every branch push, including throwaway
    # test branches. Swap this back to `branches: [ "main/root" ]` (or add
    # a pattern like `branches: [ "main/root", "test/**" ]`) if you'd
    # rather only test specific branches.
  pull_request:
    branches: [ "main/root" ]

env:
  CARGO_TERM_COLOR: always
  # Use mold linker for 5x-10x faster linking on Linux
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  audit:
    name: Security & Lint Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run RustSec security audit
        run: cargo audit --deny warnings

  build-and-test:
    name: Build & Nextest
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install clang and mold linker
        run: sudo apt-get update && sudo apt-get install -y clang mold

      - name: Install prebuilt cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Build and run tests with nextest
        run: cargo nextest run --profile ci --workspace --all-targets --no-fail-fast

      - name: Publish JUnit test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Nextest Audit Results
          path: target/nextest/ci/junit.xml
          reporter: java-junit
